services:

  client:
    build:
      context: ./client
    container_name: ecommerce-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: ecommerce-server
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/ecommerce
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
